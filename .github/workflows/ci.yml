name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: farmos
          POSTGRES_PASSWORD: farmos
          POSTGRES_DB: farmos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U farmos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Owner role runs migrations; the API and RLS tests use the restricted role.
      MIGRATION_DATABASE_URL: postgresql://farmos:farmos@localhost:5432/farmos?schema=public
      DATABASE_URL: postgresql://farmos_api:ci_app_password@localhost:5432/farmos?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to a fresh database
        run: pnpm --filter @farmos/api prisma:migrate:deploy
      - name: Create the runtime database role
        run: pnpm --filter @farmos/api db:app-user
      - name: Check schema and migrations are in sync
        working-directory: apps/api
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Integration tests (rebuilds farmos_test from migrations)
        run: pnpm test:integration
      # No API key in CI: this checks the eval fixture against its hand-calculated
      # figures and skips the model cases, which run as a release step.
      - name: Assistant evaluation fixture
        run: pnpm --filter @farmos/api eval:assistant

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t farmos-api:${{ github.sha }} .
