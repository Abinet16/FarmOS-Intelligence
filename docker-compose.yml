name: farmos

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-farmos}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-farmos} -d ${POSTGRES_DB:-farmos}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER:-farmos_api}:${APP_DB_PASSWORD:-farmos_api_dev_password}@postgres:5432/${POSTGRES_DB:-farmos}?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      CORS_ORIGINS: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:4000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      REPORTS_DIR: /app/var/reports
      LOG_FORMAT: json
    ports:
      - '4000:4000'
    volumes:
      - reports:/app/var/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background jobs: the same image as the API, started with the worker entry point.
  worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ['node', 'dist/worker.js']
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER:-farmos_api}:${APP_DB_PASSWORD:-farmos_api_dev_password}@postgres:5432/${POSTGRES_DB:-farmos}?schema=public
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_URL: http://localhost:4000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      REPORTS_DIR: /app/var/reports
      WEB_URL: http://localhost:3000
      LOG_FORMAT: json
    # Report files written here are downloaded through the API, so both mount it.
    volumes:
      - reports:/app/var/reports
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  reports:
